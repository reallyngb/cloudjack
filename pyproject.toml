[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudjack"
version = "0.1.0"
description = "Offline AWS IAM identity attack-path simulator (synthetic data only)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Joel Akinsanya", email = "joel@example.com" },
]
keywords = ["aws", "iam", "security", "attack-path", "cloud-security", "offensive-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "pydantic>=2.7,<3",
    "networkx>=3.3,<4",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "pyvis>=0.3.2,<1",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
cloudjack = "cloudjack.cli:app"

[project.urls]
Homepage = "https://github.com/reallyngb/cloudjack"
Issues = "https://github.com/reallyngb/cloudjack/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cloudjack.web" = ["template.html"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.12"
files = ["src/cloudjack"]
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
